<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="1000" height="640" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Triangle ABC:
       A = (440, 40)
       B = (80, 260)
       C = (400, 260)
       D on AB such that AD : BD = 2 : 1 => D = (1/3)*A + (2/3)*B = (440/3 + 160/3, 40/3 + 520/3) = (200, 560/3 approx 186.67).
       E on AC such that AE : CE = 2 : 1 => E = (1/3)*A + (2/3)*C = (440/3 + 800/3, 40/3 + 520/3) = (413.33, 186.67).
       F is midpoint of DE => F = ((200 + 413.33)/2, 186.67) = (306.67, 186.67).
       Triangle FBC shaded.
  -->
  
  <!-- Triangle FBC shaded area -->
  <polygon points="80,260 400,260 306.67,186.67" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>

  <!-- Triangle ABC main outline -->
  <polygon points="440,40 80,260 400,260" fill="none" stroke="#2C3E50" stroke-width="3"/>

  <!-- Segment DE -->
  <line x1="200" y1="186.67" x2="413.33" y2="186.67" stroke="#2980B9" stroke-width="2.5"/>

  <!-- Segments FB and FC (already outlined by polygon FBC) -->
  <line x1="80" y1="260" x2="306.67" y2="186.67" stroke="#E91E63" stroke-width="2"/>
  <line x1="400" y1="260" x2="306.67" y2="186.67" stroke="#E91E63" stroke-width="2"/>

  <!-- Points -->
  <circle cx="440" cy="40" r="4.5" fill="#2C3E50"/>
  <circle cx="80" cy="260" r="4.5" fill="#2C3E50"/>
  <circle cx="400" cy="260" r="4.5" fill="#2C3E50"/>
  <circle cx="200" cy="186.67" r="4.5" fill="#2980B9"/>
  <circle cx="413.33" cy="186.67" r="4.5" fill="#2980B9"/>
  <circle cx="306.67" cy="186.67" r="5" fill="#E91E63"/>

  <!-- Labels -->
  <text x="445" y="32" font-size="22" font-weight="bold" fill="#2C3E50" font-style="italic">A</text>
  <text x="55" y="275" font-size="20" font-weight="bold" fill="#2C3E50" font-style="italic">B</text>
  <text x="415" y="275" font-size="20" font-weight="bold" fill="#2C3E50" font-style="italic">C</text>
  <text x="175" y="185" font-size="20" font-weight="bold" fill="#2980B9" font-style="italic">D</text>
  <text x="425" y="185" font-size="20" font-weight="bold" fill="#2980B9" font-style="italic">E</text>
  <text x="300" y="172" font-size="20" font-weight="bold" fill="#E91E63" font-style="italic">F</text>
</svg>
