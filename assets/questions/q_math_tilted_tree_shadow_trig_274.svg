<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="1000" height="640" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <!-- Sun gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFA41B"/>
    </radialGradient>
  </defs>

  <!-- Ground Line -->
  <line x1="40" y1="260" x2="460" y2="260" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

  <!-- Sunlight ray AC and beyond -->
  <line x1="280" y1="260" x2="430" y2="60" stroke="#F39C12" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Tilted Tree Trunk AB -->
  <!-- B=(100, 260), A=(400, 86.8) -->
  <line x1="100" y1="260" x2="400" y2="86.8" stroke="#795548" stroke-width="7" stroke-linecap="round"/>

  <!-- Tree foliage (green clouds along AB) -->
  <g fill="#4CAF50" opacity="0.85">
    <circle cx="180" cy="214" r="16"/>
    <circle cx="230" cy="185" r="20"/>
    <circle cx="280" cy="156" r="22"/>
    <circle cx="330" cy="127" r="25"/>
    <circle cx="370" cy="104" r="26"/>
    <circle cx="400" cy="86.8" r="22"/>
    <circle cx="250" cy="165" r="18" fill="#66BB6A"/>
    <circle cx="310" cy="130" r="20" fill="#66BB6A"/>
    <circle cx="360" cy="95" r="20" fill="#81C784"/>
  </g>

  <!-- Points and labels -->
  <!-- Point B -->
  <circle cx="100" cy="260" r="4" fill="#2C3E50"/>
  <text x="80" y="280" font-size="20" font-weight="bold" fill="#2C3E50" font-style="italic">B</text>

  <!-- Point C (Shadow end) -->
  <circle cx="280" cy="260" r="4" fill="#2C3E50"/>
  <text x="275" y="285" font-size="20" font-weight="bold" fill="#2C3E50" font-style="italic">C</text>

  <!-- Point D (Ground reference) -->
  <circle cx="430" cy="260" r="4" fill="#2C3E50"/>
  <text x="435" y="285" font-size="20" font-weight="bold" fill="#2C3E50" font-style="italic">D</text>

  <!-- Point A (Tree top) -->
  <circle cx="400" cy="86.8" r="4" fill="#C0392B"/>
  <text x="415" y="85" font-size="22" font-weight="bold" fill="#C0392B" font-style="italic">A</text>

  <!-- Sun icon at top right -->
  <g transform="translate(435, 45)">
    <circle cx="0" cy="0" r="18" fill="url(#sunGrad)"/>
    <!-- Sun rays -->
    <path d="M 0,-26 L 0,-20 M 0,26 L 0,20 M -26,0 L -20,0 M 26,0 L 20,0 M -18,-18 L -14,-14 M 18,18 L 14,14 M -18,18 L -14,14 M 18,-18 L 14,-14" stroke="#FFA41B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Angles -->
  <!-- Angle at B = 30 deg -->
  <path d="M 140,260 A 40,40 0 0,0 134.6,240" fill="none" stroke="#E74C3C" stroke-width="2"/>
  <text x="145" y="250" font-size="16" font-weight="bold" fill="#E74C3C">30°</text>

  <!-- Angle at C = 60 deg (exterior angle to ray AC and ground right CD) -->
  <path d="M 315,260 A 35,35 0 0,0 297.5,229.7" fill="none" stroke="#E74C3C" stroke-width="2"/>
  <text x="320" y="245" font-size="16" font-weight="bold" fill="#E74C3C">60°</text>

  <!-- Dimension line for shadow BC = 10 -->
  <line x1="100" y1="275" x2="280" y2="275" stroke="#2980B9" stroke-width="2"/>
  <path d="M 100,270 L 100,280 M 280,270 L 280,280" stroke="#2980B9" stroke-width="2"/>
  <text x="180" y="298" font-size="18" font-weight="bold" fill="#2980B9" text-anchor="middle">10</text>
</svg>
